apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: ${POSTGRES_IMAGE}
          env:
            - {name: POSTGRES_USER, value: opencve}
            - {name: POSTGRES_PASSWORD, value: opencve}
            - {name: POSTGRES_DB, value: opencve}
          readinessProbe:
            exec: {command: [pg_isready, -U, opencve, -h, 127.0.0.1]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webserver
data:
  DJANGO_SETTINGS_MODULE: opencve.conf.base
  OPENCVE_DATABASE_URL: postgresql://opencve:opencve@postgres:5432/opencve
  OPENCVE_SECRET_KEY: opencve-e2e-insecure-secret-key
  DJANGO_SUPERUSER_USERNAME: admin
  DJANGO_SUPERUSER_EMAIL: admin@opencve-e2e.local
  DJANGO_SUPERUSER_PASSWORD: opencve-e2e-password
  GUNICORN_CMD_ARGS: --workers 2 --access-logfile -
---
apiVersion: v1
kind: Service
metadata:
  name: webserver
spec:
  type: NodePort
  selector: {app: webserver}
  ports: [{port: 8000, nodePort: 30900}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webserver
spec:
  selector: {matchLabels: {app: webserver}}
  template:
    metadata: {labels: {app: webserver}}
    spec:
      enableServiceLinks: false
      initContainers:
        - name: migrate
          image: opencve-web:${OPENCVE_VERSION}
          command: [python, manage.py, migrate, --noinput]
          envFrom: [{configMapRef: {name: webserver}}]
      containers:
        - name: webserver
          image: opencve-web:${OPENCVE_VERSION}
          envFrom: [{configMapRef: {name: webserver}}]
          readinessProbe:
            tcpSocket: {port: 8000}
