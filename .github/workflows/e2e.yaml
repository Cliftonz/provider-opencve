name: End to End Testing

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: kind runs a self-hosted OpenCVE in the cluster; saas uses the OPENCVE_* secrets
        type: choice
        options: [kind, saas]
        default: kind

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: >-
      github.event_name != 'pull_request'
      || (github.event.action != 'labeled' || github.event.label.name == 'run-e2e')
      && (startsWith(github.head_ref, 'spec/')
      || contains(github.event.pull_request.labels.*.name, 'run-e2e'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_TARGET: ${{ inputs.target || 'kind' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Start harness
        env:
          OPENCVE_TOKEN: ${{ secrets.OPENCVE_TOKEN }}
          OPENCVE_ORGANIZATION: ${{ secrets.OPENCVE_ORGANIZATION }}
          OPENCVE_URL: ${{ secrets.OPENCVE_URL }}
        run: test/harness/up.sh
      - name: Run e2e
        run: test/harness/e2e.sh
