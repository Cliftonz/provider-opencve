name: Spec Tracking

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch: {}

concurrency:
  group: spec-tracking
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          missing=""
          for name in APP_CLIENT_ID APP_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="${missing} ${name}"
          done
          if [ -z "$missing" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipped: repository secrets not configured:${missing}."
          fi

  generate:
    needs: gate
    if: needs.gate.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.spec.outputs.changed }}
      version: ${{ steps.spec.outputs.new_version }}
      breaking: ${{ steps.breaking.outcome }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Fetch schema
        run: hack/spec-fetch.sh "$RUNNER_TEMP/opencve-v2.yaml"
      - name: Detect change
        id: spec
        run: hack/spec-changed.sh openapi/opencve-v2.yaml "$RUNNER_TEMP/opencve-v2.yaml" >> "$GITHUB_OUTPUT"
      - name: Regenerate
        if: steps.spec.outputs.changed == 'true'
        run: |
          cp "$RUNNER_TEMP/opencve-v2.yaml" openapi/opencve-v2.yaml
          make generate
      - name: Breaking-change gate
        id: breaking
        if: steps.spec.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: make crd-breaking-changes
      - name: Export changes
        if: steps.spec.outputs.changed == 'true'
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.spec.outputs.changed == 'true'
        with:
          name: changes
          path: ${{ runner.temp }}/changes.patch
          overwrite: true

  pr:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    env:
      SPEC_VERSION: ${{ needs.generate.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changes
          path: ${{ runner.temp }}
      - name: Check changed paths
        run: hack/patch-paths.sh "$RUNNER_TEMP/changes.patch"
      - name: Set git identity
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          git config --global user.name "${SLUG}[bot]"
          git config --global user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - name: Open PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BREAKING: ${{ needs.generate.outputs.breaking }}
        run: |
          hack/open-pr.sh "$SPEC_VERSION" "$RUNNER_TEMP/changes.patch" \
            "OpenCVE API schema version ${SPEC_VERSION} from https://app.opencve.io/api/v2/schema/

          CRD breaking-change gate: ${BREAKING}. On failure, a maintainer adds the breaking-change label to accept it; the next release is then a major bump (minor while 0.x)."

  report:
    needs: [generate, pr]
    if: failure() && needs.generate.outputs.version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SPEC_VERSION: ${{ needs.generate.outputs.version }}
        run: 'hack/failure-issue.sh "OpenCVE schema ${SPEC_VERSION}: spec tracking"'
