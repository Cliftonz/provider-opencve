name: Simulate Spec Tracking

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  simulate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          submodules: true
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Fetch schema
        run: hack/spec-fetch.sh "$RUNNER_TEMP/opencve-v2.yaml"
      - name: Detect change
        run: hack/spec-changed.sh openapi/opencve-v2.yaml "$RUNNER_TEMP/opencve-v2.yaml"
      - name: Regenerate
        run: |
          cp "$RUNNER_TEMP/opencve-v2.yaml" openapi/opencve-v2.yaml
          make generate
      - name: Breaking-change gate
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: make crd-breaking-changes
      - name: Check changed paths
        run: |
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/changes.patch"
          hack/patch-paths.sh "$RUNNER_TEMP/changes.patch"
