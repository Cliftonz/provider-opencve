apiVersion: project.opencve.m.clifton.quest/v1alpha1
kind: Project
metadata:
  name: example-automation-project
  namespace: default
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/automation
    uptest.upbound.io/pre-delete-hook: 'testhooks/automation-api.sh updated || exit 1'
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    name: example-automation-project
---
apiVersion: automation.opencve.m.clifton.quest/v1alpha1
kind: Automation
metadata:
  name: example-automation
  namespace: default
  annotations:
    meta.upbound.io/example-id: automation/v1alpha1/automation
    uptest.upbound.io/post-assert-hook: 'testhooks/automation-api.sh'
    uptest.upbound.io/post-delete-hook: 'testhooks/automation-api.sh deleted || exit 1'
    uptest.upbound.io/update-parameter: '{"scheduleWeekday":"friday"}'
spec:
  providerConfigRef:
    kind: ProviderConfig
    name: default
  forProvider:
    projectNameRef:
      name: example-automation-project
    name: example-automation
    isEnabled: true
    triggerType: report
    frequency: weekly
    scheduleTimezone: UTC
    scheduleTime: "09:00:00"
    scheduleWeekday: monday
    configuration:
      conditions:
        operator: OR
        children:
          - type: kev_present
            value: true
      actions:
        - type: generate_report
          value: true
