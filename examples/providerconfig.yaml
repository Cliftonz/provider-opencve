apiVersion: v1
kind: Secret
metadata:
  name: opencve-credentials
  namespace: default
type: Opaque
stringData:
  credentials: |
    {"token": "opc_org.<token_id>.<secret>", "organization": "<organization>", "url": "https://app.opencve.io"}
---
apiVersion: opencve.m.clifton.quest/v1beta1
kind: ProviderConfig
metadata:
  name: default
  namespace: default
spec:
  credentials:
    source: Secret
    secretRef:
      name: opencve-credentials
      namespace: default
      key: credentials
